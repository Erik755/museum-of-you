<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>The Museum of You</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <p class="eyebrow">Colección permanente</p>
    <h1 id="titleTap">The Museum of You</h1>
    <p class="sub">Objetos insignificantes. Tratamiento solemne.</p>
    <button type="button" id="installBtn" class="install-btn">Instalar app</button>
    <p class="tiny" id="installHint"></p>
  </header>

  <main>
    <section class="panel hidden" id="setup">
      <h2>Curador (solo tú)</h2>
      <p class="hint">La API key se guarda en este teléfono, no en GitHub.</p>
      <label>
        API key de Groq
        <input id="apiKey" type="password" autocomplete="off" placeholder="gsk_..." />
      </label>
      <label>
        Modelo
        <select id="model">
          <option value="qwen/qwen3.8-27b">Qwen 3.8 27B</option>
          <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout (visión)</option>
        </select>
      </label>
      <label>
        Nombre del museo / habitante
        <input id="owner" type="text" placeholder="Ej. Michelle" />
      </label>
      <label>
        Prompt del curador
        <textarea id="promptBox" rows="12"></textarea>
      </label>
      <button type="button" id="resetPrompt" class="ghost">Restablecer prompt</button>
      <button type="button" id="saveSetup" class="ghost">Guardar en este teléfono</button>
      <button type="button" id="hideSetup" class="ghost">Ocultar ajustes</button>
      <p class="tiny" id="setupStatus"></p>
    </section>

    <section class="panel">
      <h2>Nueva pieza</h2>
      <div class="actions">
        <label class="file-btn">
          Tomar o subir foto
          <input id="photo" type="file" accept="image/*" capture="environment" hidden />
        </label>
        <button type="button" id="generate" disabled>Archivar en el museo</button>
      </div>
      <img id="preview" alt="Vista previa" hidden />
      <p class="status" id="status"></p>
    </section>

    <section class="exhibit" id="exhibit" hidden></section>

    <section class="panel">
      <div class="row">
        <h2>Tu museo</h2>
        <span id="count">0 piezas</span>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <div id="lightbox" class="lightbox hidden" role="dialog">
    <button type="button" id="closeLb" class="close-lb">Cerrar</button>
    <div id="lbInner" class="lb-inner"></div>
    <div class="lb-actions">
      <button type="button" id="shareBtn">Compartir</button>
      <button type="button" id="downloadBtn" class="ghost">Guardar imagen</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
